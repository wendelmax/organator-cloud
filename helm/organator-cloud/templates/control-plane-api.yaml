{{- $component := "control-plane-api" -}}
{{- $values := .Values.controlPlaneApi -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "organator-cloud.fullname" . }}-{{ $component }}
  labels:
    {{- include "organator-cloud.labels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ $values.replicaCount }}
  selector:
    matchLabels:
      {{- include "organator-cloud.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "organator-cloud.selectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      {{- if $values.migrations.enabled }}
      initContainers:
        - name: migrate
          image: {{ include "organator-cloud.image" (dict "ctx" . "image" $values.image) | quote }}
          imagePullPolicy: {{ $values.image.pullPolicy }}
          workingDir: /app
          command: ["npm", "run", "migrate:deploy", "--workspace=@organator/core-models"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            {{- include "organator-cloud.databaseEnv" . | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: {{ include "organator-cloud.image" (dict "ctx" . "image" $values.image) | quote }}
          imagePullPolicy: {{ $values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            {{- include "organator-cloud.databaseEnv" . | nindent 12 }}
            {{- include "organator-cloud.redisEnv" . | nindent 12 }}
            {{- include "organator-cloud.secretEnv" (dict "ctx" . "key" "JWT_SECRET") | nindent 12 }}
            {{- include "organator-cloud.secretEnv" (dict "ctx" . "key" "ENCRYPTION_KEY") | nindent 12 }}
            {{- if .Values.ingress.enabled }}
            - name: BACKOFFICE_URL
              value: {{ printf "https://%s" .Values.ingress.hosts.web | quote }}
            {{- end }}
            {{- range $key, $value := $values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- with $values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml $values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "organator-cloud.fullname" . }}-{{ $component }}
  labels:
    {{- include "organator-cloud.labels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: {{ $values.service.type }}
  ports:
    - port: {{ $values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "organator-cloud.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
