{{- $component := "backoffice-web" -}}
{{- $values := .Values.backofficeWeb -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "organator-cloud.fullname" . }}-{{ $component }}
  labels:
    {{- include "organator-cloud.labels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ $values.replicaCount }}
  selector:
    matchLabels:
      {{- include "organator-cloud.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "organator-cloud.selectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $component }}
          image: {{ include "organator-cloud.image" (dict "ctx" . "image" $values.image) | quote }}
          imagePullPolicy: {{ $values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            # Chamadas server-side (NextAuth, server actions) usam o Service interno.
            - name: API_URL
              value: {{ printf "http://%s-control-plane-api:%v" (include "organator-cloud.fullname" .) .Values.controlPlaneApi.service.port | quote }}
            {{- if .Values.ingress.enabled }}
            - name: NEXTAUTH_URL
              value: {{ printf "https://%s" .Values.ingress.hosts.web | quote }}
            {{- end }}
            {{- include "organator-cloud.secretEnv" (dict "ctx" . "key" "NEXTAUTH_SECRET") | nindent 12 }}
            {{- with $values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml $values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "organator-cloud.fullname" . }}-{{ $component }}
  labels:
    {{- include "organator-cloud.labels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: {{ $values.service.type }}
  ports:
    - port: {{ $values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "organator-cloud.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
