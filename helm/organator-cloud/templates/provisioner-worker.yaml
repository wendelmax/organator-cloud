{{- $component := "provisioner-worker" -}}
{{- $values := .Values.provisionerWorker -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "organator-cloud.fullname" . }}-{{ $component }}
  labels:
    {{- include "organator-cloud.labels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ $values.replicaCount }}
  selector:
    matchLabels:
      {{- include "organator-cloud.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "organator-cloud.selectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $values.metrics.port | quote }}
        prometheus.io/path: /metrics
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Deixa jobs em andamento terminarem (worker.close aguarda o job atual).
      terminationGracePeriodSeconds: 120
      containers:
        - name: {{ $component }}
          image: {{ include "organator-cloud.image" (dict "ctx" . "image" $values.image) | quote }}
          imagePullPolicy: {{ $values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: metrics
              containerPort: {{ $values.metrics.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: METRICS_HOST
              value: "0.0.0.0"
            - name: METRICS_PORT
              value: {{ $values.metrics.port | quote }}
            {{- include "organator-cloud.databaseEnv" . | nindent 12 }}
            {{- include "organator-cloud.redisEnv" . | nindent 12 }}
            {{- include "organator-cloud.secretEnv" (dict "ctx" . "key" "ENCRYPTION_KEY") | nindent 12 }}
            {{- with .Values.dataIsolation }}
            - name: DATA_ISOLATION_ENABLED
              value: {{ .enabled | toString | quote }}
            {{- if .enabled }}
            - name: DATA_ISOLATION_ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "dataIsolation.adminUrlSecret.name é obrigatório com dataIsolation.enabled=true" .adminUrlSecret.name }}
                  key: {{ .adminUrlSecret.key }}
            - name: DATA_ISOLATION_TABLES
              value: {{ required "dataIsolation.tables é obrigatório com dataIsolation.enabled=true" .tables | toJson | quote }}
            - name: DATA_ISOLATION_ROLLBACK_HOURS
              value: {{ .rollbackHours | quote }}
            {{- end }}
            {{- end }}
            {{- with $values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml $values.resources | nindent 12 }}
