name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Turborepo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Prisma Generate
        env:
          # url dummy: `prisma generate` não conecta no banco, apenas valida a config
          DATABASE_URL: postgresql://organator:password@localhost:5432/organator_db?schema=public
        run: npx prisma generate --schema packages/core-models/prisma/schema.prisma

      - name: Lint
        run: npx turbo lint

      - name: Build
        run: npx turbo build
