version: 2
updates:
  # Monorepo npm (workspaces): um PR semanal agrupado para minor/patch e PRs
  # separados para majors. Atualizações de segurança chegam imediatamente.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors com breaking changes que exigem migração planejada.
      - dependency-name: prisma
        update-types: [version-update:semver-major]
      - dependency-name: "@prisma/client"
        update-types: [version-update:semver-major]
      - dependency-name: "@babel/types"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /apps/control-plane-api
      - /apps/provisioner-worker
      - /apps/backoffice-web
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # O runtime segue o "engines" do projeto (Node 24); troca de major é deliberada.
      - dependency-name: node
        update-types: [version-update:semver-major]
