version: 2
updates:
  # Monorepo npm (workspaces): um PR semanal agrupado para minor/patch e PRs
  # separados para majors. Atualizações de segurança chegam imediatamente.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /apps/control-plane-api
      - /apps/provisioner-worker
      - /apps/backoffice-web
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
