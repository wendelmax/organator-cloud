version: 2
updates:
  # Monorepo npm (workspaces): um PR semanal agrupado para minor/patch.
  # Majors (Nest, Next, TypeScript, Prisma, ESLint...) precisam ser atualizados
  # em conjunto e deliberadamente, então não são propostos automaticamente.
  # Vulnerabilidades sem correção na major atual são barradas pelo
  # `npm audit` do CI.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /apps/control-plane-api
      - /apps/provisioner-worker
      - /apps/backoffice-web
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # O runtime segue o "engines" do projeto (Node 24); troca de major é deliberada.
      - dependency-name: node
        update-types: [version-update:semver-major]
