version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: organator
      POSTGRES_PASSWORD: password
      POSTGRES_DB: organator_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U organator"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  control-plane-api:
    build:
      context: .
      dockerfile: apps/control-plane-api/Dockerfile
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://organator:password@postgres:5432/organator_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  provisioner-worker:
    build:
      context: .
      dockerfile: apps/provisioner-worker/Dockerfile
    environment:
      - DATABASE_URL=postgresql://organator:password@postgres:5432/organator_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  backoffice-web:
    build:
      context: .
      dockerfile: apps/backoffice-web/Dockerfile
    environment:
      - NEXTAUTH_URL=http://localhost:3001
      - NEXTAUTH_SECRET=supersecret_organator_key
      - API_URL=http://control-plane-api:3000
    ports:
      - "3001:3000"
    depends_on:
      - control-plane-api

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3002:3000"
    environment:
      # SSO via VoidAuth (OIDC) — mesmo admin do Organator acessa o Grafana
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=VoidAuth
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${VOIDAUTH_CLIENT_ID}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${VOIDAUTH_CLIENT_SECRET}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email groups
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=${VOIDAUTH_URL}/oidc/authorize
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=${VOIDAUTH_URL}/oidc/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=${VOIDAUTH_URL}/oidc/userinfo
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups[*], 'auth_admins') && 'Admin' || 'Viewer'
      - GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN=true
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_AUTH_ANONYMOUS_ENABLED=false

  voidauth:
    image: voidauth/voidauth:latest
    restart: unless-stopped
    environment:
      APP_URL: ${VOIDAUTH_URL:-http://localhost:3003}
      STORAGE_KEY: ${VOIDAUTH_STORAGE_KEY:-dev_storage_key_change_me}
      DB_ADAPTER: postgres
      DB_HOST: voidauth-db
      DB_PASSWORD: ${VOIDAUTH_DB_PASSWORD:-password}
    ports:
      - "3003:3000"
    depends_on:
      voidauth-db:
        condition: service_healthy

  voidauth-db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${VOIDAUTH_DB_PASSWORD:-password}
    volumes:
      - voidauth_db_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  voidauth_db_data:
